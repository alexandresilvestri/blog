services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://alexandre:0405@db:5432/blog
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: alexandre
      POSTGRES_PASSWORD: '0405'
      POSTGRES_DB: blog
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U alexandre -d blog']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
